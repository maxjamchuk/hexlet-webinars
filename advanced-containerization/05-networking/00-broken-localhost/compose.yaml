services:
  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-9000}:8000"
  client:
    build: .
    command: ["uvicorn", "app.client:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      API_URL: http://localhost:9000/message
    ports:
      - "127.0.0.1:${CLIENT_PORT:-8080}:8000"
