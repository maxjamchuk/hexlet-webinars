[project]
name = "anomaly-registry-tests"
version = "0.1.0"
description = "Anomaly Registry API с бонусными тестами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi[standard]>=0.115,<1",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
