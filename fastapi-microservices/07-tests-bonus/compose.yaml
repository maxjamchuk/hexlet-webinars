services:
  api:
    build: .
    environment:
      DATABASE_URL: sqlite:////data/incidents.db
    ports:
      - "8000:8000"
    volumes:
      - anomaly_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  anomaly_data:
