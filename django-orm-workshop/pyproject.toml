[project]
name = "django-orm-workshop"
version = "0.1.0"
description = "Comic Catalog: a reproducible Django ORM workshop"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-extensions>=4.1,<5",
    "ipython>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["catalog/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
