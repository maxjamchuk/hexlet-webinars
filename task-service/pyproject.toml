[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-service"
version = "0.1.0"
description = "A small educational Task CRUD API built with Flask"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
